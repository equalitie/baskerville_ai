<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Baskerville Agent</title>
    <style>
        body {
            font-family: Arial;
            max-width: 700px;
            margin: auto;
            padding: 0;
            background: #f4f4f4;
            display: flex;
            flex-direction: column;
            height: 100vh; /* Вся высота окна */
        }
        header {
            display: flex;
            align-items: center;
            padding: 10px 20px;
            background: white;
            border-bottom: 1px solid #ddd;
        }
        header img { height: 40px; margin-right: 10px; }

        /* Чат занимает всё доступное пространство, скроллится внутри себя */
        #chat-box {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            background: white;
        }

        .msg { display: flex; margin: 10px 0; }
        .icon {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #ccc;
        }
        .icon img { width: 100%; height: 100%; object-fit: cover; }
        .bubble { padding: 10px; border-radius: 10px; max-width: 80%; }
        .user .bubble { background: #d1ecf1; margin-left: auto; }
        .bot .bubble { background: #f8d7da; }
        .typing { font-style: italic; color: gray; }

        /* Поле ввода закреплено внизу */
        .input-container {
            display: flex;
            background: white;
            border-top: 1px solid #ccc;
            padding: 8px;
            align-items: center;
        }
        .input-container input {
            flex: 1;
            border: none;
            padding: 10px 15px;
            font-size: 14px;
            outline: none;
            border-radius: 20px;
            background: #f0f0f0;
            margin-right: 8px;
        }
        .send-btn {
            width: 40px;
            height: 40px;
            border: none;
            background: #007bff;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background 0.3s;
            border-radius: 50%;
        }
        .send-btn:hover { background: #0056b3; }
        .send-btn svg { width: 18px; height: 18px; fill: white; }
        .user {
            flex-direction: row-reverse;
        }
        .user .bubble {
            background: #d1ecf1;
            margin-left: 0;
            margin-right: 10px;
        }
        .user .icon {
            margin-left: 10px;
        }

    </style>
</head>
<body>
    <header>
        <img src="/static/logo_baskerville.png" alt="Baskerville Logo">
        <h2>Baskerville Agent</h2>
    </header>

    <div id="chat-box"></div>

    <div class="input-container">
        <input type="text" id="msg" placeholder="Type a message">
        <button class="send-btn" onclick="sendMsg()">
            <svg viewBox="0 0 24 24">
                <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
            </svg>
        </button>
    </div>

    <script>
        function scrollToBottom(force = false) {
            const chatBox = document.getElementById("chat-box");
            if (force || chatBox.scrollHeight - chatBox.scrollTop - chatBox.clientHeight < 50) {
                chatBox.scrollTop = chatBox.scrollHeight;
            }
        }

        function addMsg(role, text){
            let row = document.createElement("div");
            row.className = "msg " + role;

            let icon = document.createElement("div");
            icon.className = "icon";
            if (role === "user") {
                icon.innerHTML = '👤';
            } else {
                icon.innerHTML = '<img src="/static/logo_bot.png" alt="Bot">';
            }

            let bubble = document.createElement("div");
            bubble.className = "bubble";
            bubble.innerHTML = text;

            row.appendChild(icon);
            row.appendChild(bubble);
            document.getElementById("chat-box").appendChild(row);
            scrollToBottom(true);
            return bubble;
        }

        async function sendMsg(){
            let msg = document.getElementById("msg").value.trim();
            if (!msg) return;
            document.getElementById("msg").value = "";
            addMsg("user", msg);

            let bubble = addMsg("bot", "<span class='typing'>typing...</span>");

            const res = await fetch("/chat", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({message: msg}),
                credentials: "include"
            });

            bubble.innerHTML = "";
            const reader = res.body.getReader();
            const decoder = new TextDecoder();
            let fullText = "";
            while (true) {
                const {value, done} = await reader.read();
                if (done) break;
                fullText += decoder.decode(value);
                bubble.innerHTML = fullText;
                scrollToBottom();
            }
            scrollToBottom(true);
        }

        document.getElementById("msg").addEventListener("keypress", function(e) {
            if (e.key === "Enter") sendMsg();
        });
    </script>
</body>
</html>
