apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: baskerville-ai-ingress
  namespace: default
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/rewrite-target: /$1
spec:
  tls:
    - hosts:
        - ai.greything.com
      secretName: ai-greything-com-tls
  rules:
    - host: ai.greything.com
      http:
        paths:
          - path: /(.*)
            pathType: Prefix
            backend:
              service:
                name: baskerville-ai-service
                port:
                  number: 80
